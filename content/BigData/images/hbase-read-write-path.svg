<rect x="490" y="12" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="506" y="21" font-size="12" fill="#757575">Read path</text>
<rect x="580" y="12" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="596" y="21" font-size="12" fill="#757575">Background</text>

<rect x="260" y="32" width="160" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
