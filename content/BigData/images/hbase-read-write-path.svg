<svg width="100%" viewBox="0 0 680 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" xmlns="http://www.w3.org/2000/svg">
<title>HBase read and write path</title>
<desc>Write path: client writes go to WAL then MemStore; MemStore flushes to HFiles on HDFS. Read path: client reads merge MemStore and BlockCache (backed by HFiles). Compaction merges small HFiles into larger ones.</desc>
