<svg width="100%" viewBox="0 0 680 580" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Apache Flink runtime architecture</title>
<desc>Client submits a JobGraph to the JobManager containing Dispatcher, ResourceManager and JobMaster. TaskManagers provide task slots for operator-chained subtasks. Data streams flow between TaskManagers via network shuffle.</desc>
