<text x="342" y="443" text-anchor="middle" font-size="12" fill="#0F6E56">/hbase/data/</text>

<rect x="450" y="408" width="170" height="44" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="535" y="426" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">hbase:meta</text>
