<text x="180" y="64" font-size="12" fill="#757575">discover meta</text>
<line x1="340" y1="68" x2="340" y2="130" stroke="#9E9E9E" stroke-width="1.5" fill="none" marker-end="url(#arrow-9e9e9e)"/>
<text x="352" y="104" font-size="12" fill="#757575">read / write</text>
<line x1="420" y1="54" x2="524" y2="90" stroke="#7F77DD" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-7f77dd)"/>
<text x="460" y="64" font-size="12" fill="#757575">DDL</text>

<rect x="56" y="92" width="200" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="156" y="112" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">ZooKeeper</text>
<text x="156" y="130" text-anchor="middle" font-size="12" fill="#534AB7">meta location · liveness</text>

<rect x="424" y="92" width="200" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="524" y="112" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">HMaster</text>
<text x="524" y="130" text-anchor="middle" font-size="12" fill="#534AB7">DDL · region assign · balance</text>

<line x1="424" y1="116" x2="260" y2="116" stroke="#7F77DD" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-7f77dd)"/>

<rect x="40" y="154" width="600" height="180" rx="8" fill="none" stroke="#E0E0E0" stroke-width="0.5" stroke-dasharray="4 3"/>
