<svg width="100%" viewBox="0 0 680 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" xmlns="http://www.w3.org/2000/svg">
<title>HBase cluster architecture</title>
<desc>Client connects via ZooKeeper to discover region locations, then reads/writes directly to RegionServers. HMaster handles DDL and region assignment. Each RegionServer holds multiple regions, each with WAL, MemStore and HFiles on HDFS.</desc>
<defs><marker id="arrow-9e9e9e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-7f77dd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="520" fill="#FDFDFC"/>

<rect x="440" y="12" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="456" y="21" font-size="12" fill="#757575">Data path</text>
<rect x="530" y="12" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="546" y="21" font-size="12" fill="#757575">Coordination</text>

<rect x="260" y="32" width="160" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
