<text x="425" y="228" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Region C</text>
<text x="425" y="244" text-anchor="middle" font-size="12" fill="#0F6E56">MemStore + WAL</text>

<rect x="492" y="210" width="110" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="547" y="228" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Region D</text>
<text x="547" y="244" text-anchor="middle" font-size="12" fill="#0F6E56">MemStore + WAL</text>

<rect x="370" y="264" width="232" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="486" y="286" text-anchor="middle" font-size="14" fill="#444441">BlockCache (LRU)</text>

<line x1="194" y1="334" x2="194" y2="374" stroke="#9E9E9E" stroke-width="1.5" fill="none" marker-end="url(#arrow-9e9e9e)"/>
<line x1="486" y1="334" x2="486" y2="374" stroke="#9E9E9E" stroke-width="1.5" fill="none" marker-end="url(#arrow-9e9e9e)"/>
